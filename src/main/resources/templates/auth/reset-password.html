<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MC Bakers</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .strength-bar {
            height: 5px;
            border-radius: 4px;
            margin-top: 6px;
            background: #eee;
            transition: background 0.3s, width 0.3s;
        }

        .strength-label {
            font-size: 0.78rem;
            color: #9A8070;
            margin-top: 3px;
        }

        .auth-heading {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auth-heading svg {
            width: 20px;
            height: 20px;
            color: var(--brown-main);
            flex-shrink: 0;
        }
    </style>
</head>
<body class="auth">
<div class="container">
    <div class="page-back-row">
        <a th:href="@{/login}" class="btn btn-secondary btn-sm">Back to Login</a>
    </div>
    <div class="form-card">
        <h2 style="display:flex;align-items:center;gap:10px;">
            <img th:src="@{/images/logo.png}" width="40" alt="logo"> MC Bakers
        </h2>

        <h3 class="auth-heading">
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="2"
                 aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 11V8a5 5 0 0 1 10 0v3"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 11h12v9H6z"/>
            </svg>
            Reset Password
        </h3>

        <div th:if="${error != null and token == null}">
            <div class="alert alert-error" th:text="${error}"></div>
            <p class="text-center"><a th:href="@{/forgot-password}">Try Again</a></p>
        </div>

        <div th:if="${error != null and token != null}" class="alert alert-error" th:text="${error}"></div>

        <div th:if="${token != null}">
            <p style="color:#9A8070;font-size:0.9rem;margin-bottom:20px;">
                Hello <strong th:text="${userName}"></strong>, set your new password here.
            </p>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">

                <div class="form-group">
                    <label>New Password</label>
                    <input type="password"
                           name="newPassword"
                           id="newPwd"
                           required
                           placeholder="Minimum 6 characters"
                           oninput="checkStrength(this.value)">
                    <div class="strength-bar" id="strengthBar"></div>
                    <div class="strength-label" id="strengthLabel"></div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password"
                           name="confirmPassword"
                           id="confirmPwd"
                           required
                           placeholder="Re-enter password"
                           oninput="checkMatch()">
                    <div class="strength-label" id="matchLabel"></div>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;">
                    Reset Password
                </button>
            </form>
        </div>

    </div>
</div>

<script>
    function checkStrength(val) {
        const bar = document.getElementById('strengthBar');
        const label = document.getElementById('strengthLabel');
        let score = 0;

        if (val.length >= 6) score++;
        if (val.length >= 10) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        const colors = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#27ae60'];
        const labels = ['Very Weak', 'Weak', 'Fair', 'Strong', 'Very Strong'];

        bar.style.background = val ? colors[score - 1] || '#eee' : '#eee';
        bar.style.width = val ? (score * 20) + '%' : '100%';
        label.textContent = val ? labels[score - 1] || '' : '';
    }

    function checkMatch() {
        const password = document.getElementById('newPwd').value;
        const confirmation = document.getElementById('confirmPwd').value;
        const label = document.getElementById('matchLabel');

        if (!confirmation) {
            label.textContent = '';
            return;
        }

        label.textContent = password === confirmation ? 'Passwords match' : 'Passwords do not match';
        label.style.color = password === confirmation ? '#2ecc71' : '#e74c3c';
    }
</script>
</body>
</html>
