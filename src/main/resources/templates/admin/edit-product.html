<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <span style="display:flex;align-items:center;gap:10px;font-family:'Playfair Display',serif;font-size:1.1rem;color:#fff;font-weight:700;">
        <img th:src="@{/images/logo.png}" width="36" alt="logo" style="border-radius:50%;border:2px solid #F0C878;">
        MC Bakers Admin
    </span>
    <button class="hamburger" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="navbar-links" id="navLinks">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/products}">Products</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</nav>
<div class="container">
    <div class="page-back-row">
        <a th:href="@{/admin/products}" class="btn btn-secondary btn-sm">Back to Products</a>
    </div>
    <div class="form-card">
        <h2>Edit Product</h2>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <form th:action="@{/admin/product/edit/{id}(id=${product.id})}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" required th:value="${product.name}">
            </div>
            <div class="form-group">
                <label>Price</label>
                <input type="number" name="price" min="0" step="0.01" required th:value="${product.price}">
            </div>
            <div class="form-group">
                <label>Stock</label>
                <input type="number" name="stock" min="0" required th:value="${product.stock}">
            </div>
            <div class="form-group">
                <label>Current Image</label><br>
                <img th:src="@{/images/products/{img}(img=${product.image})}" th:alt="${product.name}"
                     style="width:110px;height:80px;object-fit:cover;border-radius:8px;"
                     onerror="this.style.display='none'">
            </div>
            <div class="form-group">
                <label>Replace Image</label>
                <input type="file" name="imageFile" accept="image/*">
            </div>
            <button type="submit" class="btn btn-primary">Update Product</button>
        </form>
    </div>
</div>
<script>(function(){var b=document.getElementById('navToggle'),m=document.getElementById('navLinks');if(b&&m)b.addEventListener('click',function(){m.classList.toggle('open');});})()</script>
</body>
</html>
