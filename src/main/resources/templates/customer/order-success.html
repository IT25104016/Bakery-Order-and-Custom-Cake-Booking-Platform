<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Order Placed - MC Bakers</title><link rel="stylesheet" th:href="@{/css/style.css}">
<style>
    .status-Pending   { background:#fff3cd; color:#856404; }
    .status-Preparing { background:#cce5ff; color:#004085; }
    .status-Ready     { background:#d4edda; color:#155724; }
    .status-Completed { background:#e2e3e5; color:#383d41; }

    .success-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #e8f5e9;
        color: #2e7d32;
        margin-bottom: 18px;
        border: 2px solid #a5d6a7;
    }

    .success-icon svg {
        width: 34px;
        height: 34px;
    }

    .order-actions {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 18px;
    }

    .order-actions .btn svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
    }
</style>
</head>
<body>
<nav th:replace="~{fragments/customer-navbar :: navbar}"></nav>
<div class="container">
    <div class="page-back-row">
        <a th:href="@{/customer/products}" class="btn btn-secondary btn-sm">Back to Products</a>
    </div>
    <div class="success-card">
        <div class="success-icon">
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="2.4"
                 aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h2>Order Placed Successfully!</h2>
        <p>Thank you, <strong th:text="${userName}"></strong>!</p>
        <div th:if="${lastOrderId}" style="background:#fff8f0; border-radius:10px; padding:14px; margin:16px 0;">
            <p>Your Order ID: <strong>#<span th:text="${lastOrderId}"></span></strong></p>
        </div>
        <p>Status: <span class="badge badge-pending">Pending</span></p>
        <br>

        <h3>Your Orders</h3>
        <div class="table-wrap"><table class="table">
            <thead><tr><th>Order #</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="'#' + ${order.id}"></td>
                    <td th:text="'Rs. ' + ${#numbers.formatDecimal(order.total, 1, 2)}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="'status-' + ${order.status}"
                              th:text="${order.status}"></span>
                    </td>
                    <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                </tr>
            </tbody>
        </table>
    </div>
        <br>
        <div class="order-actions">
            <a th:href="@{/customer/products}" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="2"
                     aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 7h15l-2 9H8L6 7z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 7L5 4H3"/>
                    <circle cx="9" cy="20" r="1"/>
                    <circle cx="18" cy="20" r="1"/>
                </svg>
                Continue Shopping
            </a>

            <a th:href="@{/customer/my-orders}" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="2"
                     aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 3h10a2 2 0 0 1 2 2v16l-3-2-3 2-3-2-3 2-3-2V5a2 2 0 0 1 2-2z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 8h8M8 12h8M8 16h5"/>
                </svg>
                All My Orders
            </a>

            <a th:href="@{/customer/custom-order}" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="2"
                     aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14v8H5z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12c0-2.2 3.1-4 7-4s7 1.8 7 4"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 8V5M12 8V5M16 8V5"/>
                </svg>
                Custom Order
            </a>
        </div>
    </div>
</div>
<script>(function(){var b=document.getElementById('navToggle'),m=document.getElementById('navLinks');if(b&&m)b.addEventListener('click',function(){m.classList.toggle('open');});})()</script>
</body>
</html>
