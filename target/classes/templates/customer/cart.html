<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - MC Bakers</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .title-with-icon { display:flex; align-items:center; gap:8px; }
    .title-with-icon svg { width:24px; height:24px; color:var(--brown-main); }
    .alert svg { width:16px; height:16px; flex-shrink:0; }
    .btn svg { width:16px; height:16px; flex-shrink:0; }
  </style>
</head>
<body>
<nav th:replace="~{fragments/customer-navbar :: navbar}"></nav>
<div class="container">
  <div class="page-back-row">
    <a th:href="@{/customer/products}" class="btn btn-secondary btn-sm">Back to Products</a>
  </div>
  <h2 class="title-with-icon">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 7h15l-2 9H8L6 7z"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 7L5 4H3"/>
      <circle cx="9" cy="20" r="1"/>
      <circle cx="18" cy="20" r="1"/>
    </svg>
    Your Cart
  </h2>
  <div th:if="${param.empty}" class="alert alert-error">Your cart is empty!</div>
  <div th:if="${stockError}" class="alert alert-error">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.3 4.2 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/>
    </svg>
    <span th:text="${stockError}"></span>
  </div>
  <div th:if="${cart == null or cart.isEmpty()}" class="empty-cart">
    <p>No items in cart.</p>
    <a th:href="@{/customer/products}" class="btn btn-primary">Continue Shopping</a>
  </div>
  <div th:unless="${cart == null or cart.isEmpty()}">
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Total</th><th>Action</th></tr></thead>
        <tbody>
        <tr th:each="item : ${cart}">
          <td th:text="${item.productName}"></td>
          <td th:text="'Rs. ' + ${#numbers.formatDecimal(item.price, 1, 2)}"></td>
          <td th:text="${item.quantity}"></td>
          <td th:text="'Rs. ' + ${#numbers.formatDecimal(item.total, 1, 2)}"></td>
          <td>
            <form th:action="@{/customer/cart/remove}" method="post" style="display:inline">
              <input type="hidden" name="productId" th:value="${item.productId}">
              <button type="submit" class="btn btn-danger btn-sm">Remove</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="cart-total">
      <h3>Grand Total: Rs. <span th:text="${#numbers.formatDecimal(grandTotal, 1, 2)}"></span></h3>
      <a th:href="@{/customer/checkout}" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
        Proceed to Checkout
      </a>
      <a th:href="@{/customer/products}" class="btn btn-secondary">Continue Shopping</a>
    </div>
  </div>
</div>
<script>(function(){var b=document.getElementById('navToggle'),m=document.getElementById('navLinks');if(b&&m)b.addEventListener('click',function(){m.classList.toggle('open');});})()</script>
</body>
</html>
