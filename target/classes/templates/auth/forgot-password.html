<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MC Bakers</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-heading {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auth-heading svg,
        .btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .auth-heading svg {
            color: var(--brown-main);
        }
    </style>
</head>
<body class="auth">
<div class="container">
    <div class="page-back-row">
        <a th:href="@{/login}" class="btn btn-secondary btn-sm">Back to Login</a>
    </div>
    <div class="form-card">
        <h2 style="display:flex;align-items:center;gap:10px;">
            <img th:src="@{/images/logo.png}" width="40" alt="logo"> MC Bakers
        </h2>

        <h3 class="auth-heading">
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="2"
                 aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a4 4 0 1 1-3.5 6H8l-2 2H4v-2l2-2h5.5A4 4 0 0 1 15 7z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 11h.01"/>
            </svg>
            Forgot Password
        </h3>

        <p style="color:#9A8070;font-size:0.9rem;margin-bottom:20px;">
            Enter your registered email address. A reset link will be sent to your email.
        </p>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="your@email.com" autofocus>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">
                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="2"
                     aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16v12H4z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="m4 7 8 6 8-6"/>
                </svg>
                Send Reset Link
            </button>
        </form>

    </div>
</div>
</body>
</html>
