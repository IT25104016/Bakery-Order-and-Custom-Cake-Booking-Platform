<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MC Bakers</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth">
<div class="container">
    <div class="page-back-row">
        <a th:href="@{/customer/products}" class="btn btn-secondary btn-sm">Back to Products</a>
    </div>
    <div class="form-card">
        <h2 style="display:flex;align-items:center;gap:10px;">
            <img th:src="@{/images/logo.png}" width="40" alt="logo"> MC Bakers
        </h2>
        <h3>Create Account</h3>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="Enter email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>

        <p class="text-center">Already have an account? <a th:href="@{/login}">Login</a></p>
    </div>
</div>
</body>
</html>
