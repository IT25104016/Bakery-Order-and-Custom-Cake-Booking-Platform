<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MC Bakers</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth">
<div class="container">
    <div class="page-back-row">
        <a th:href="@{/customer/products}" class="btn btn-secondary btn-sm">Back to Products</a>
    </div>
    <div class="form-card">
        <h2 style="display:flex;align-items:center;gap:10px;">
            <img th:src="@{/images/logo.png}" width="40" alt="logo"> MC Bakers
        </h2>
        <h3>Login</h3>

        <div th:if="${error}"         class="alert alert-error"   th:text="${error}"></div>
        <div th:if="${logout}"        class="alert alert-success">You have been logged out.</div>
        <div th:if="${registered}"    class="alert alert-success">Registration successful! Please login.</div>
        <div th:if="${passwordReset}" class="alert alert-success" th:text="${passwordReset}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="Enter email">
            </div>
            <div class="form-group">
                <label style="display:flex;justify-content:space-between;">
                    Password
                    <a th:href="@{/forgot-password}" style="font-size:0.85rem;font-weight:400;">Forgot password?</a>
                </label>
                <input type="password" name="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <p class="text-center">Don't have an account? <a th:href="@{/register}">Register</a></p>
    </div>
</div>
</body>
</html>
